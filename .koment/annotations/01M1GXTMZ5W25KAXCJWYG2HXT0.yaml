spec:
  target:
    file: internal/controller/workstation_controller.go
  type: why
  title: Resolution failures surface their cause in status, not logs
  body: |-
    Assembly failures are expected steady states (a missing secret, an
    unresolvable tool), so the reconciler requeues quietly instead of returning
    an error that would spam logs and escalate backoff. The price was total
    silence: the operator once looped for hours with generic "did not resolve"
    conditions and zero diagnostics. The condition message therefore carries the
    assembly error verbatim, bounded to resolutionFailureDetailLimit so a
    pathological error cannot bloat etcd writes. Assembly errors are constructed
    from field paths, resource names, and command outcomes, never secret values,
    so embedding them in status does not violate the no-secrets-in-status rule.
  anchor:
    scope: excerpt
    excerpt: const resolutionFailureDetailLimit = 1024
    before: "\t})\n}\n"
    after: "\nfunc resolutionFailureMessage(cause error) string {\n\tmessage := \"The desired resources did not resolve.\""
