spec:
  target:
    file: .koment/policy.yaml
  type: why
  title: Version markers on pinned actions are Renovate's, not prose
  body: |-
    Every GitHub Action in the workflows is pinned to a commit SHA with a
    trailing version marker such as "# v6". Renovate's github-actions manager
    reads that marker to know which release the SHA represents and rewrites both
    together on updates; deleting the markers silently breaks action updates,
    and converting them to annotations would detach them from the lines Renovate
    rewrites. home-ops allowlists the identical pattern for the same reason, so
    the two repositories stay consistent.
  anchor:
    scope: excerpt
    excerpt: |2-
          allowedAnnotations:
            - "^v\\d+(\\.\\d+)*"
    before: |2-
            - upstream-link
            - deprecated
            - public-api
    after: |2-
          generatedPaths:
            - '**/*.gen.go'
            - '**/*.generated.go'
  author:
    name: claude-code
    kind: agent
    source: session
