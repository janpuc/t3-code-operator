spec:
  target:
    file: internal/controller/storage_defaults.go
  type: why
  title: Default claims are small, retained, and on the default class
  body: |-
    The sizes are the smallest that survived real use: `/data` holds harness
    homes, the mise tool cache, and t3 session state, which stayed under 10Gi on
    the production Workstation, and `/workspace` holds cloned repositories plus
    their build caches, where 50Gi left headroom. Both default to `Retain`
    because a Workstation is recreated far more often than its data should be,
    and to no storage class so a fresh cluster's default provisioner works
    without a value. The claim template inherits whichever of these the user
    left out, so overriding one field never drops the others.
  anchor:
    scope: excerpt
    excerpt: "const (\n\tdefaultDataClaimSize      = \"20Gi\"\n\tdefaultWorkspaceClaimSize = \"50Gi\""
    before: "\t\"k8s.io/apimachinery/pkg/api/resource\"\n)\n"
