spec:
  target:
    file: api/v1alpha1/provider_types.go
  type: why
  title: Providers opt in with an explicit enabled and no empty-object shorthand
  body: |-
    `enabled` has no default on purpose, so `codex: {}` is rejected by the CRD
    schema and a provider only exists in the rendered provider map after someone
    wrote `enabled: true`. The first draft of this API treated an empty block as
    opt-in; the maintainer rejected that as bad design because presence is too
    easy to produce by accident (a stray key, a merge) and too hard to read as
    intent. `enabled: false` keeps the block's settings and parks the instance,
    which matches upstream t3, where a provider instance can be persisted and
    disabled at the same time.
  anchor:
    scope: excerpt
    excerpt: "\tEnabled bool `json:\"enabled\"`"
    before: "\t// +kubebuilder:validation:Pattern=`^[A-Za-z][A-Za-z0-9_-]{0,63}$`\n\tDriver string `json:\"driver,omitempty\"`\n"
    after: "\n\t// +kubebuilder:validation:MaxLength=128\n\tDisplayName string `json:\"displayName,omitempty\"`"
