spec:
  target:
    file: LICENSE
  type: why
  title: AGPL over Apache-2.0 because this runs as a network service
  body: |-
    Apache-2.0 is the prevailing licence in the Kubernetes operator ecosystem
    and would have been the frictionless choice. AGPL-3.0-or-later was picked
    anyway, for two reasons.

    It matches koment, the closest comparable project in this account: a
    publicly maintained tool with a plugin surface that other people install.
    Keeping the two aligned means contributors meet one licence, not two.

    More to the point, an operator is exactly the case the AGPL's network clause
    was written for. This software's normal mode of use is running as a service
    on someone's cluster rather than being distributed as a binary, which is the
    gap that plain GPL leaves open and Apache-2.0 does not attempt to close.

    Revisit only if outside contribution or downstream packaging is actually
    blocked by it, not on the general principle that operators are usually
    Apache-2.0.
