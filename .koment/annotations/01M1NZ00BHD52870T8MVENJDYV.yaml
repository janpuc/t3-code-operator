  type: why
  title: Inline providers are content, keyed by DNS labels children can name
  body: |-
    The map lives on the Workstation because a vanilla deployment should be one
    object, not a Workstation plus one Harness per provider. It does not violate
    the one invariant: the pod template is built from image, env, resources,
    security context, storage, and SMB only, so a provider change publishes a
    new rendered revision and never a new pod revision
    (TestProviderContentChangeDoesNotUpdateTheDeployment guards this).

    Keys double as the upstream instance ID and as the name an Extension or
    MCPServer puts in `harnessRefs`, which is why the CEL rule restricts them to
    lowercase DNS labels that start with a letter: the reference type only
    admits DNS names, and t3 slugs must start with a letter. A provider whose
    instance ID cannot be a DNS label, or one shared by several Workstations, is
    still a Harness.
  anchor:
    scope: excerpt
    excerpt: "\t// +kubebuilder:validation:MaxProperties=32\n\tProviders map[string]ProviderSpec `json:\"providers,omitempty\"`"
