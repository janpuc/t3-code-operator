  title: Group diverges from the sibling operators on purpose
  body: |-
    The two other operators in this account use miroir.home-operations.com and
    kopiur.home-operations.com. This one uses janpuc.com, and a future reader
    comparing the three will otherwise assume it is an oversight.

    It is not. The convention is to root an API group in a domain you actually
    control, janpuc.com is controlled by this account, and the Workstation this
    operator manages is already served at t3.janpuc.com. The divergence was
    raised explicitly during design and kept.

    Every kind is namespaced, and that half is genuinely irreversible:
    namespaced to cluster-scoped cannot be done later, while namespaced plus an
    opt-in cross-namespace reference is purely additive. It also bounds the
    blast radius of the fact that an Extension is instructions for an agent
    holding a GitHub token and a kubectl MCP connection.
