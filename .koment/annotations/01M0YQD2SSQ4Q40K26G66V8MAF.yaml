  type: why
  title: API group drops the hyphen that the product name carries
  body: |-
    The product is spelled "t3-code" and the repository is named for it, but the
    API group is "t3code.janpuc.com" with no hyphen in the first label.

    Both spellings are legal DNS subdomains and therefore legal API groups. The
    unhyphenated form is the prevailing convention for Kubernetes API groups,
    and it avoids awkward hyphen handling in generated Go package names and
    client-go apply-configuration paths, which are derived from the group.

    janpuc.com is used rather than a bare "t3code.dev" because the convention is
    to root an API group in a domain you actually control, and this account
    controls janpuc.com.
