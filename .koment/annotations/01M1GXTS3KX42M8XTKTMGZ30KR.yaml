  type: why
  title: Release bundles keep a wrapper directory the installers must descend
  body: |-
    GitHub release archives conventionally wrap their payload in one top-level
    directory: koment-plugin-codex tarballs extract to koment-codex-marketplace/
    with the marketplace manifest one level down. The pre-operator init script
    hid this with tar --strip-components=1. The operator extracts archives
    verbatim into the extension cache, so passing the cache content root to
    `codex plugin marketplace add` fails with "marketplace root does not contain
    a supported manifest" — the first live canary hit exactly that as an
    ExtensionCommitFailed loop. Descending happens at install time rather than
    fetch time so that already-populated cache entries are also repaired; a
    valid marketplace root must hold a manifest file, so a root holding exactly
    one directory and nothing else can never itself be the marketplace. The
    DirEntry type check refuses to descend through symlinks, keeping the
    resolved root inside the managed cache.
  anchor:
    scope: excerpt
    excerpt: func descendSingleRootDirectory(path string) (string, error) {
    before: "\treturn result, nil\n}\n"
    after: "\tentries, err := os.ReadDir(path)\n\tif err != nil {\n\t\treturn \"\", err"
