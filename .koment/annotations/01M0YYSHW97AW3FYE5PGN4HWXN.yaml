  title: Rejecting the OCI skills draft as the primary source type
  body: |-
    Choosing not to adopt a published specification looks like negligence unless
    the reasoning is recorded, so here it is.

    The Agent Skills OCI Artifacts spec is a genuine, well-constructed proposal
    with media types, a lockfile schema and reference tooling. It was rejected
    as the primary source type on evidence, not taste: 14 stars, no push in over
    four months, still a draft, proposed to the core Agent Skills spec and not
    merged, and most decisively, no agent harness reads it. Claude Code, Codex
    and OpenCode all consume a directory on disk or a git repository, and none
    of them consume an OCI artifact.

    Adopting it as the primary path would have meant writing the installer
    anyway while inheriting a dependency on a draft that may never land. That is
    strictly worse than pointing at the thing the ecosystem already consumes.

    It survives as an additive OCI source type because inside a cluster the
    transport is genuinely better than git: digest pinning, no GitHub API
    credentials in the pod, cosign verification, and native handling by Flux and
    Renovate. Published artifacts should carry the draft's media types, which
    costs nothing and buys compatibility if it is ever adopted.

    Revisit if the core specification merges a distribution chapter, or if any
    harness ships native OCI support. Both are cheap to detect and neither has
    happened.
