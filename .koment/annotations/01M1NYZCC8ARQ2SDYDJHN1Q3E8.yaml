spec:
  target:
    file: .github/workflows/release.yaml
  type: why
  title: The published chart pins the runtime digest that git cannot know
  body: |-
    The runtime digest only exists after the image job merges the per-platform
    manifests, so a release-prepare commit cannot carry it and the verify job's
    `git diff --exit-code` must keep passing on the untouched tree. Writing it
    into values.yaml in the publish job, after that check and before `helm
    package`, is what lets a Workstation without `spec.image` run the runtime
    built for this operator version. The edit stays in the runner's checkout;
    git keeps an empty digest so local `helm template` renders without a default
    image, which the chart contract asserts.
  anchor:
    scope: excerpt
    excerpt: '          yq -i ''.workstation.image.digest = strenv(RUNTIME_DIGEST)'' charts/t3-code-operator/values.yaml'
    before: |2-
              run: |
                set -euo pipefail
                mkdir -p dist
    after: |2-
                helm package charts/t3-code-operator --destination dist
                (
                  cd dist
