name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned development tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          cache: true

      - name: Validate workflows
        run: actionlint

      - name: Run unit tests
        run: go test ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Run the API server contract
        run: make test-api

      - name: Regenerate API artifacts
        run: make generate chart-crds

      - name: Reject stale generated artifacts
        run: git diff --exit-code -- api/v1alpha1/zz_generated.deepcopy.go config/crd charts/t3-code-operator/crds

      - name: Run the chart contract
        run: make test-chart

      - name: Validate scripts
        run: |
          find hack images -type f -name '*.sh' -print0 | xargs -0 bash -n
          find hack -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Reject whitespace errors
        run: git diff --check

  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and verify the stable runtime image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          files: docker-bake.hcl
          targets: stable
          set: |
            stable.platform=linux/amd64
            stable.output=type=cacheonly
            stable.tags=t3-code-operator:ci
            stable.cache-from=type=gha,scope=stable-runtime
            stable.cache-to=type=gha,mode=max,scope=stable-runtime
