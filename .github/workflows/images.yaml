name: Runtime images

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      track:
        description: Image track to publish
        required: true
        type: choice
        default: stable
        options:
          - stable
          - nightly

permissions: {}

concurrency:
  group: runtime-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      repository: ${{ steps.image.outputs.repository }}
      track: ${{ steps.image.outputs.track }}
      build_date: ${{ steps.image.outputs.build_date }}
    steps:
      - name: Select the image track
        id: image
        shell: bash
        env:
          REQUESTED_TRACK: ${{ inputs.track }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            track=nightly
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            track="$REQUESTED_TRACK"
          else
            track=stable
          fi

          {
            echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/t3-code-runtime"
            echo "track=$track"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >>"$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the per-platform runtime by digest
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          files: docker-bake.hcl
          targets: ${{ needs.plan.outputs.track }}-digest
          set: |
            *.platform=${{ matrix.platform }}
            *.args.VCS_REF=${{ github.sha }}
            *.args.BUILD_DATE=${{ needs.plan.outputs.build_date }}

      - name: Record the per-platform digest
        shell: bash
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
          IMAGE_TRACK: ${{ needs.plan.outputs.track }}
        run: |
          set -euo pipefail
          mkdir -p digests
          jq -er --arg track "$IMAGE_TRACK" '.[$track + "-digest"]["containerimage.digest"]' <<<"$BAKE_METADATA" >digests/runtime

      - name: Upload the per-platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-digest-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Download the per-platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: runtime-digest-*

      - name: Merge, tag, and sign the runtime image
        id: sign
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ needs.plan.outputs.repository }}
          IMAGE_TRACK: ${{ needs.plan.outputs.track }}
        run: |
          set -euo pipefail
          amd64_digest="$(cat digests/runtime-digest-amd64/runtime)"
          arm64_digest="$(cat digests/runtime-digest-arm64/runtime)"
          docker buildx imagetools create \
            --tag "$IMAGE_REPOSITORY:$IMAGE_TRACK" \
            "$IMAGE_REPOSITORY@$amd64_digest" \
            "$IMAGE_REPOSITORY@$arm64_digest"
          digest="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$IMAGE_TRACK" --format '{{json .Manifest}}' | jq -er .digest)"
          cosign sign --yes "$IMAGE_REPOSITORY@$digest"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Record the immutable image reference
        env:
          IMAGE_REPOSITORY: ${{ needs.plan.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.sign.outputs.digest }}
          IMAGE_TRACK: ${{ needs.plan.outputs.track }}
        run: |
          {
            echo "### Published $IMAGE_TRACK runtime"
            echo
            echo '\`'"$IMAGE_REPOSITORY@$IMAGE_DIGEST"'\`'
          } >>"$GITHUB_STEP_SUMMARY"
