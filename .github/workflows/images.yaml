name: Runtime images

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      track:
        description: Image track to publish
        required: true
        type: choice
        default: stable
        options:
          - stable
          - nightly

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: runtime-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select the image track and tags
        id: image
        shell: bash
        env:
          REQUESTED_TRACK: ${{ inputs.track }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            track=nightly
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            track="$REQUESTED_TRACK"
          else
            track=stable
          fi

          {
            echo "repository=$repository"
            echo "track=$track"
            echo "tags=$repository:$track"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >>"$GITHUB_OUTPUT"

      - name: Install emulation support
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Install Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Build and publish the runtime image
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        with:
          files: docker-bake.hcl
          targets: ${{ steps.image.outputs.track }}
          push: true
          set: |
            ${{ steps.image.outputs.track }}.tags=${{ steps.image.outputs.tags }}
            *.args.VCS_REF=${{ github.sha }}
            *.args.BUILD_DATE=${{ steps.image.outputs.build_date }}

      - name: Sign the published image digest
        id: sign
        shell: bash
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TRACK: ${{ steps.image.outputs.track }}
        run: |
          set -euo pipefail
          digest="$(jq -er --arg track "$IMAGE_TRACK" '.[$track]["containerimage.digest"]' <<<"$BAKE_METADATA")"
          cosign sign --yes "$IMAGE_REPOSITORY@$digest"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Record the immutable image reference
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.sign.outputs.digest }}
          IMAGE_TRACK: ${{ steps.image.outputs.track }}
        run: |
          {
            echo "### Published $IMAGE_TRACK runtime"
            echo
            echo '\`'"$IMAGE_REPOSITORY@$IMAGE_DIGEST"'\`'
          } >>"$GITHUB_STEP_SUMMARY"
