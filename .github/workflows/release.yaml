name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      operator_repository: ${{ steps.release.outputs.operator_repository }}
      runtime_repository: ${{ steps.release.outputs.runtime_repository }}
      smbd_repository: ${{ steps.release.outputs.smbd_repository }}
      chart_repository: ${{ steps.release.outputs.chart_repository }}
      build_date: ${{ steps.release.outputs.build_date }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the pinned release tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.8.12
          cache: true

      - name: Validate the release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must use v-prefixed semantic versioning" >&2
            exit 1
          fi

          chart_version="$(awk '$1 == "version:" { print $2; exit }' charts/t3-code-operator/Chart.yaml)"
          app_version="$(awk '$1 == "appVersion:" { print $2; exit }' charts/t3-code-operator/Chart.yaml | tr -d '\"')"
          if [[ "$chart_version" != "$version" || "$app_version" != "$version" ]]; then
            echo "tag, chart version, and appVersion must match" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "operator_repository=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "runtime_repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/t3-code-runtime"
            echo "smbd_repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/t3-code-smbd"
            echo "chart_repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/t3-code-operator"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >>"$GITHUB_OUTPUT"

      - name: Run the release contracts
        run: |
          actionlint
          go test ./...
          make test-api
          make test-chart
          git diff --exit-code

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the per-platform images by digest
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          files: docker-bake.hcl
          targets: release-digests
          set: |
            *.platform=${{ matrix.platform }}
            *.args.VCS_REF=${{ github.sha }}
            *.args.BUILD_DATE=${{ needs.verify.outputs.build_date }}

      - name: Record the per-platform digests
        shell: bash
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          mkdir -p digests
          jq -er '."stable-digest"."containerimage.digest"' <<<"$BAKE_METADATA" >digests/runtime
          jq -er '."operator-digest"."containerimage.digest"' <<<"$BAKE_METADATA" >digests/operator
          jq -er '."smbd-digest"."containerimage.digest"' <<<"$BAKE_METADATA" >digests/smbd

      - name: Upload the per-platform digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install the pinned release tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.8.12
          cache: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Download the per-platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: digests-*

      - name: Merge, tag, and sign the images
        id: images
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          OPERATOR_REPOSITORY: ${{ needs.verify.outputs.operator_repository }}
          RUNTIME_REPOSITORY: ${{ needs.verify.outputs.runtime_repository }}
          SMBD_REPOSITORY: ${{ needs.verify.outputs.smbd_repository }}
        run: |
          set -euo pipefail
          merge_image() {
            local name=$1 repository=$2 moving_tag=$3
            local amd64_digest arm64_digest merged
            amd64_digest="$(cat "digests/digests-amd64/$name")"
            arm64_digest="$(cat "digests/digests-arm64/$name")"
            docker buildx imagetools create \
              --tag "$repository:$moving_tag" \
              --tag "$repository:v$RELEASE_VERSION" \
              --tag "$repository:$RELEASE_VERSION" \
              "$repository@$amd64_digest" \
              "$repository@$arm64_digest"
            merged="$(docker buildx imagetools inspect "$repository:$RELEASE_VERSION" --format '{{json .Manifest}}' | jq -er .digest)"
            cosign sign --yes "$repository@$merged"
            echo "${name}_digest=$merged" >>"$GITHUB_OUTPUT"
          }
          merge_image runtime "$RUNTIME_REPOSITORY" stable
          merge_image operator "$OPERATOR_REPOSITORY" latest
          merge_image smbd "$SMBD_REPOSITORY" latest

      - name: Package and publish the Helm chart
        id: chart
        shell: bash
        env:
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          CHART_REPOSITORY: ${{ needs.verify.outputs.chart_repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package charts/t3-code-operator --destination dist
          (
            cd dist
            sha256sum "t3-code-operator-$RELEASE_VERSION.tgz" >"t3-code-operator-$RELEASE_VERSION.tgz.sha256"
          )
          printf '%s' "$GHCR_PASSWORD" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/t3-code-operator-$RELEASE_VERSION.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" 2>&1 | tee dist/helm-push.txt
          digest="$(awk '$1 == "Digest:" && $2 ~ /^sha256:/ { print $2; exit }' dist/helm-push.txt)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Helm did not report the chart digest" >&2
            exit 1
          fi
          cosign sign --yes "$CHART_REPOSITORY@$digest"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          OPERATOR_REPOSITORY: ${{ needs.verify.outputs.operator_repository }}
          RUNTIME_REPOSITORY: ${{ needs.verify.outputs.runtime_repository }}
          SMBD_REPOSITORY: ${{ needs.verify.outputs.smbd_repository }}
          OPERATOR_DIGEST: ${{ steps.images.outputs.operator_digest }}
          RUNTIME_DIGEST: ${{ steps.images.outputs.runtime_digest }}
          SMBD_DIGEST: ${{ steps.images.outputs.smbd_digest }}
          CHART_REPOSITORY: ${{ needs.verify.outputs.chart_repository }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "Alpha release of t3-code-operator."
            echo
            echo "Operator image: \`$OPERATOR_REPOSITORY@$OPERATOR_DIGEST\`"
            echo
            echo "Runtime image: \`$RUNTIME_REPOSITORY@$RUNTIME_DIGEST\`"
            echo
            echo "SMB sidecar image: \`$SMBD_REPOSITORY@$SMBD_DIGEST\`"
            echo
            echo "Helm chart: \`oci://$CHART_REPOSITORY --version $RELEASE_VERSION\`"
            echo
            echo "Chart digest: \`$CHART_DIGEST\`"
            echo
            echo "Cursor, Grok, SMB, and drain behavior remain alpha until their live acceptance tests pass."
          } >dist/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "dist/t3-code-operator-$RELEASE_VERSION.tgz" \
            "dist/t3-code-operator-$RELEASE_VERSION.tgz.sha256" \
            --verify-tag \
            --title "t3-code-operator $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md

      - name: Record the immutable release references
        env:
          OPERATOR_REPOSITORY: ${{ needs.verify.outputs.operator_repository }}
          RUNTIME_REPOSITORY: ${{ needs.verify.outputs.runtime_repository }}
          SMBD_REPOSITORY: ${{ needs.verify.outputs.smbd_repository }}
          OPERATOR_DIGEST: ${{ steps.images.outputs.operator_digest }}
          RUNTIME_DIGEST: ${{ steps.images.outputs.runtime_digest }}
          SMBD_DIGEST: ${{ steps.images.outputs.smbd_digest }}
          CHART_REPOSITORY: ${{ needs.verify.outputs.chart_repository }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          {
            echo "### Published release"
            echo
            echo "Operator: \`$OPERATOR_REPOSITORY@$OPERATOR_DIGEST\`"
            echo
            echo "Runtime: \`$RUNTIME_REPOSITORY@$RUNTIME_DIGEST\`"
            echo
            echo "SMB sidecar: \`$SMBD_REPOSITORY@$SMBD_DIGEST\`"
            echo
            echo "Chart: \`$CHART_REPOSITORY@$CHART_DIGEST\`"
          } >>"$GITHUB_STEP_SUMMARY"
